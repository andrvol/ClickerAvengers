<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Avengers</title>
    <link rel="stylesheet" href="./assets/styles/normalize.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <script type="module" src="./assets/JS/main.js"></script>
</head>

<body>
    <div id="desktopOnly" data-i18n="desktopOnly">‼️This game is DESKTOP only‼️</div>

    <div id="loadingScreen">
        <h1>Clicker Avengers</h1>

        <select id="languageSelect">
            <option value="en" id="english-value">English</option>
            <option value="ru">Русский</option>
            <option value="ua">Українська</option>
        </select>

        <div class="progress-container">
            <div id="progressBar"></div>
        </div>

        <button id="playBtn" data-i18n="playBtn">Play</button>
    </div>

    <div class="sound-buttons">
        <img id="musicBtn" class="music-btn" src="./assets/images/icons-elements/sound-on.webp" alt="musicOnOff">
        <img id="soundEffectsBtn" class="music-btn" src="./assets/images/icons-elements/effects-on.webp" alt="soundEffectsOnOff">
        <img src="./assets/images/icons-elements/restart-icon.webp" alt="restartingGame" class="restart-btn" id="restart-BTN">
    </div>

    <button id="dayNightBtn">☽</button>

    <div id="main-Menu" class="mainMenu">
        <div class="goldPanel">
            <img src="./assets/images/HUD/Coins-HUD.webp" alt="" class="HUD">
            <div class="goldAmount" id="goldAmount">1</div>
        </div>

        <div class="topMenu">
            <div class="upperMenu">
                <button class="upperBtn" id="booster-Btn" data-i18n="heroesBtn">Heroes</button>
                <button class="upperBtn" id="weapons-Btn" data-i18n="weaponsBtn">Weapons</button>
                <button class="upperBtn" id="stat-Btn" data-i18n="statsBtn">Statistics</button>
            </div>
        </div>

        <div class="innerMenu" id="inner-Menu">
            <div class="page active" id="boosterPage">
                <div class="containerMenu">
                    <div class="infoBox">
                        <div class="DpsBox">
                            <span data-i18n="monstersKilledText">Monsters killed</span>:
                            <span id="DPS-Box">1</span>
                        </div>

                        <div class="HitDamage">
                            <span data-i18n="hitDamageText">Hit damage</span>:
                            <span id="hit-Damage">1</span>
                        </div>

                        <div class="PassiveDamage">
                            <span data-i18n="passiveDamageText">Passive damage</span>:
                            <span id="passive-Damage">0</span>
                        </div>
                    </div>
                </div>

                <div class="levelMenu">
                    <button class="levelBtn" id="x1">x1</button>
                    <button class="levelBtn" id="x10">x10</button>
                    <button class="levelBtn" id="x25">x25</button>
                    <button class="levelBtn" id="x100">x100</button>
                    <button class="levelBtn" id="xMax">MAX</button>
                </div>

                <div class="innerContainer" id="inner-Container"></div>
            </div>

            <div class="page" id="statisticsPage">
                <div class="statsContainer">
                    <div class="statsCategory">
                        <h2 data-i18n="damageCategory">Damage</h2>

                        <div class="statRow">
                            <span data-i18n="totalDps">Total DPS</span>
                            <span id="totalDps">0</span>
                        </div>
                    </div>

                    <div class="statsCategory">
                        <h2 data-i18n="clicksCategory">Clicks</h2>

                        <div class="statRow">
                            <span data-i18n="totalClicks">Total Clicks</span>
                            <span id="totalClicks">0</span>
                        </div>

                        <div class="statRow">
                            <span data-i18n="clickDamage">Click Damage</span>
                            <span id="clickDamageStat">1</span>
                        </div>
                    </div>

                    <div class="statsCategory">
                        <h2 data-i18n="goldCategory">Gold</h2>

                        <div class="statRow">
                            <span data-i18n="totalGold">Total Gold</span>
                            <span id="totalGold">0</span>
                        </div>

                        <div class="statRow">
                            <span data-i18n="goldEarned">Gold Earned</span>
                            <span id="earnedGold">0</span>
                        </div>
                    </div>

                    <div class="statsCategory">
                        <h2 data-i18n="monstersCategory">Monsters</h2>

                        <div class="statRow">
                            <span data-i18n="monstersKilled">Monsters Killed</span>
                            <span id="monstersKilled">0</span>
                        </div>

                        <div class="statRow">
                            <span data-i18n="bossesKilled">Bosses Killed</span>
                            <span id="bossesKilled">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page" id="weaponsPage">
                <div class="statsContainer">
                    <div class="statsCategory">
                        <h2 data-i18n="weaponsCategory">Weapons</h2>
                    </div>
                </div>

                <section class="weapons-container" id="weapons-container"></section>
            </div>
        </div>
    </div>

    <canvas id="playingField"></canvas>
</body>

</html>
