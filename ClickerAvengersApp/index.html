<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Avengers</title>
    <link rel="stylesheet" href="./assets/styles/normalize.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <script type="module" src="./assets/JS/main.js"></script>
</head>

<body>
    <div id="loadingScreen">
        <h1>Clicker Avengers</h1>
        <select id="languageSelect">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="ua">Українська</option>
        </select>
        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
        <button id="playBtn">Play</button>
    </div>
    <div class="sound-buttons">
        <img id="musicBtn" class="music-btn" src="./assets/images/icons-elements/sound-on.svg" alt="musicOnOff" />
        <img id="soundEffectsBtn" class="music-btn" src="./assets/images/icons-elements/effects-on.svg"
            alt="soundEffectsOnOff" />
    </div>
    <button id="dayNightBtn">☽</button>
    <div id="mainMenu">
        <div id="boostersMenu" class="booster-statsMenu">
            <div>Boosters</div>
            <div id="boosters"></div>
        </div>
        <div id="statsMenu" class="booster-statsMenu">
            <div>Statistics</div>
            <div id="stats"></div>
        </div>
    </div>
    <canvas id="playingField"></canvas>
</body>

</html>
