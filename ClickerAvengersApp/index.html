<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker Avengers</title>
    <link rel="stylesheet" href="./assets/styles/normalize.css">
    <link rel="stylesheet" href="./assets/styles/fonts.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <script type="module" src="./assets/JS/main.js"></script>
</head>

<body>
    <div id="loadingScreen">
        <h1>Clicker Avengers</h1>
        <select id="languageSelect">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="ua">Українська</option>
        </select>
        <div class="progress-container">
            <div id="progressBar"></div>
        </div>
        <button id="playBtn">Play</button>
    </div>
    <div class="sound-buttons">
        <img id="musicBtn" class="music-btn" src="./assets/images/icons-elements/sound-on.svg" alt="musicOnOff" />
        <img id="soundEffectsBtn" class="music-btn" src="./assets/images/icons-elements/effects-on.svg"
            alt="soundEffectsOnOff" />
    </div>
    <button id="dayNightBtn">☽</button>
    <div id="main-Menu" class="mainMenu">
        <div class="upperMenu" id="upper-Menu">
            <button class="upperBtn" id="booster-Btn">Booster</button>
            <button class="upperBtn" id="stat-Btn"> Statistics</button>
            <button class="upperBtn" id="anal-Btn">Analytics</button>
        </div>
        <div class="innerMenu " id="inner-Menu">
            <div class="containerMenu" id="cont-Menu">
                <div class="infoBox" id="info-Box">
                    <div class="dpsBox" id="DPS-Box">Dps : 1</div>
                    <div class="hitDamage" id="hit-Damage">Hit damage : 1</div>
                </div>
            </div>
            <div class="levelMenu" id="level-Menu">
                <div class="levelTitle" id="level-Title">level.1</div>
                <button class="levelBtn" id="x1">x1</button>
                <button class="levelBtn" id="x10">x10</button>
                <button class="levelBtn" id="x25">x25</button>
                <button class="levelBtn" id="x100">x100</button>
                <button class="levelBtn" id="xMax">Max</button>
            </div>
            <div class="innerContainer" id="inner-Container">
                <div class="heroCard">
                    <button class="buyBtn">
                        <span>x100</span>
                        <span class="coin">🟡</span>
                        <span>15.3K</span>
                    </button>

                    <div class="heroInfo">
                        <div class="heroName">Сильный воин</div>

                        <div class="skillBox">
                            <div class="skill purple">⚡</div>
                            <div class="skill yellow">🔥</div>
                            <div class="skill red">✦</div>
                        </div>
                    </div>

                    <div class="heroRight">
                        <button class="removeBtn">−</button>
                        <div class="heroLevel">Ур.61</div>
                        <div class="heroImg">🧙</div>
                    </div>
                </div>

                <div class="heroCard">
                    <button class="buyBtn">
                        <span>x100</span>
                        <span class="coin">🟡</span>
                        <span>929K</span>
                    </button>

                    <div class="heroInfo">
                        <div class="heroName">Лесной охотник</div>

                        <div class="skillBox">
                            <div class="skill green">🌿</div>
                        </div>
                    </div>

                    <div class="heroRight">
                        <button class="removeBtn">−</button>
                        <div class="heroLevel">Ур.6</div>
                        <div class="heroImg">🧌</div>
                    </div>
                </div>

                <div class="heroCard">
                    <button class="buyBtn">
                        <span>x100</span>
                        <span class="coin">🟡</span>
                        <span>3.5K</span>
                    </button>

                    <div class="heroInfo">
                        <div class="heroName">Малый боец</div>

                        <div class="skillBox">
                            <div class="skill dark">🥊</div>
                        </div>
                    </div>

                    <div class="heroRight">
                        <button class="removeBtn">−</button>
                        <div class="heroLevel">Ур.2</div>
                        <div class="heroImg">🧍</div>
                    </div>
                </div>

                <div class="heroCard">
                    <button class="buyBtn">
                        <span>x100</span>
                        <span class="coin">🟡</span>
                        <span>13.2K</span>
                    </button>

                    <div class="heroInfo">
                        <div class="heroName">Пляжная королева</div>

                        <div class="skillBox">
                            <div class="skill red">💋</div>
                        </div>
                    </div>

                    <div class="heroRight">
                        <button class="removeBtn">−</button>
                        <div class="heroLevel">Ур.1</div>
                        <div class="heroImg">🏖️</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- <div id="boostersMenu" class="booster-statsMenu">
            <div>Boosters</div>
            <div id="boosters"></div>
        </div>
        <div id="statsMenu" class="booster-statsMenu">
            <div>Statistics</div>
            <div id="stats"></div>
        </div> -->
    </div>
    <canvas id="playingField"></canvas>
</body>

</html>
